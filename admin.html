<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sea Yachts | Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Albert+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --navy: #0E2235; --paper: #FBFBF9; --white: #FFFFFF; --glass: #E9EFEE;
    --ink: #0E2235; --muted: #5C6A73; --rule: rgba(14,34,53,0.16); --teak: #8A4B2A; --green: #2E6B4F;
    --serif: "Newsreader", Georgia, serif; --sans: "Albert Sans", "Helvetica Neue", Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1rem/1.5 var(--sans); }
  a { color: inherit; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 400; margin: 0; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 22px; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }

  header { background: var(--navy); color: var(--paper); }
  header .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 16px; }
  header h1 { font-size: 1.35rem; }
  header h1 span { opacity: 0.6; font-size: 1rem; margin-left: 8px; font-family: var(--sans); }
  header nav { display: flex; gap: 6px; align-items: center; }

  .btn { display: inline-block; text-decoration: none; font: 500 0.95rem var(--sans); padding: 10px 18px; border: 1px solid transparent; cursor: pointer; background: var(--navy); color: var(--paper); }
  .btn:hover { background: var(--teak); }
  .btn.light { background: var(--white); color: var(--navy); border-color: var(--rule); }
  .btn.light:hover { border-color: var(--navy); background: var(--white); }
  .btn.small { padding: 6px 12px; font-size: 0.86rem; }
  .btn.danger { background: var(--white); color: #9B2C2C; border-color: rgba(155,44,44,0.35); }
  .btn.danger:hover { background: #9B2C2C; color: var(--white); }
  .tab { background: transparent; color: rgba(251,251,249,0.75); border: 0; font: 500 0.95rem var(--sans); padding: 8px 14px; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--paper); box-shadow: inset 0 -2px 0 var(--paper); }
  .tab .count { background: var(--teak); color: var(--white); border-radius: 10px; padding: 1px 7px; font-size: 0.78rem; margin-left: 6px; }

  main.wrap { padding-top: 34px; padding-bottom: 80px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .bar h2 { font-size: 2rem; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters button { font: 500 0.88rem var(--sans); padding: 7px 13px; border: 1px solid var(--rule); background: var(--white); cursor: pointer; color: var(--ink); }
  .filters button[aria-pressed="true"] { background: var(--navy); color: var(--paper); border-color: var(--navy); }

  /* Login */
  .login { max-width: 400px; margin: 10vh auto; background: var(--white); border: 1px solid var(--rule); padding: 36px; }
  .login h2 { font-size: 1.8rem; margin-bottom: 6px; }
  label { display: block; font-size: 0.86rem; color: var(--muted); margin: 16px 0 6px; }
  input, select, textarea { width: 100%; font: 400 1rem var(--sans); color: var(--ink); padding: 10px 12px; border: 1px solid #B9C4CB; background: var(--white); border-radius: 0; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--navy); outline-offset: -1px; }
  textarea { min-height: 120px; resize: vertical; }
  .msg { min-height: 1.4em; margin-top: 12px; font-size: 0.92rem; color: #9B2C2C; }
  .msg.ok { color: var(--green); }

  /* Inquiry cards */
  .card { background: var(--white); border: 1px solid var(--rule); margin-bottom: 14px; }
  .card.new { border-left: 3px solid var(--teak); }
  .card-head { display: grid; grid-template-columns: 1fr auto; gap: 14px; padding: 18px 20px; cursor: pointer; }
  .card-head h3 { font-size: 1.25rem; }
  .card-head .meta { font-size: 0.88rem; color: var(--muted); margin-top: 2px; }
  .pill { display: inline-block; font-size: 0.78rem; font-weight: 600; padding: 3px 9px; border: 1px solid var(--rule); white-space: nowrap; }
  .pill.new { background: var(--teak); color: var(--white); border-color: var(--teak); }
  .pill.contacted { background: var(--glass); }
  .pill.closed { color: var(--muted); }
  .card-body { padding: 0 20px 20px; border-top: 1px solid var(--rule); }
  .details { display: grid; grid-template-columns: 170px 1fr; gap: 8px 16px; padding: 18px 0; margin: 0; }
  .details dt { color: var(--muted); font-size: 0.9rem; }
  .details dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .actions select { width: auto; padding: 6px 10px; font-size: 0.9rem; }

  /* Deals */
  .deal-row { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; padding: 16px 20px; }
  .order { display: flex; flex-direction: column; gap: 4px; }
  .order button { width: 30px; height: 26px; border: 1px solid var(--rule); background: var(--white); cursor: pointer; font-size: 0.8rem; }
  .order button:disabled { opacity: 0.3; cursor: default; }
  .deal-row h3 { font-size: 1.2rem; }
  .deal-row .meta { font-size: 0.9rem; color: var(--muted); }
  .badges { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .pill.live { background: var(--green); color: var(--white); border-color: var(--green); }
  .pill.draft { color: var(--muted); }

  .editor { background: var(--white); border: 1px solid var(--navy); padding: 26px; margin-bottom: 22px; }
  .editor h3 { font-size: 1.5rem; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 16px; }
  .grid .span2 { grid-column: span 2; }
  .grid .span4 { grid-column: 1 / -1; }
  .check { display: flex; align-items: center; gap: 10px; margin-top: 18px; font-size: 0.95rem; color: var(--ink); }
  .check input { width: 18px; height: 18px; }
  .hint { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
  .editor .actions { margin-top: 22px; }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); background: var(--white); border: 1px dashed var(--rule); }

  @media (max-width: 760px) {
    header h1 span { display: none; }
    .grid { grid-template-columns: 1fr 1fr; }
    .details { grid-template-columns: 1fr; gap: 2px; }
    .details dd { margin-bottom: 10px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Sea Yachts<span>Admin</span></h1>
    <nav id="nav" class="hidden">
      <button class="tab" id="tab-leads" aria-selected="true">Inquiries<span class="count hidden" id="new-count"></span></button>
      <button class="tab" id="tab-deals" aria-selected="false">Deals</button>
      <button class="btn small light" id="logout" style="margin-left:10px">Sign out</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <!-- LOGIN -->
  <section id="login-view" class="login">
    <h2>Sign in</h2>
    <p class="muted" style="margin:0">Sea Yachts admin. Leads and good-value deals.</p>
    <form id="login-form">
      <label for="l-email">Email</label>
      <input id="l-email" type="email" autocomplete="username" value="garry@seayachts.net" required>
      <label for="l-pass">Password</label>
      <input id="l-pass" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit" style="margin-top:22px;width:100%">Sign in</button>
      <p class="msg" id="login-msg"></p>
    </form>
  </section>

  <!-- INQUIRIES -->
  <section id="leads-view" class="hidden">
    <div class="bar">
      <h2>Inquiries</h2>
      <div class="filters" id="lead-filters">
        <button data-f="open" aria-pressed="true">Open</button>
        <button data-f="new" aria-pressed="false">New</button>
        <button data-f="contacted" aria-pressed="false">Contacted</button>
        <button data-f="closed" aria-pressed="false">Closed</button>
        <button data-f="all" aria-pressed="false">All</button>
      </div>
    </div>
    <div id="leads"></div>
  </section>

  <!-- DEALS -->
  <section id="deals-view" class="hidden">
    <div class="bar">
      <h2>Good-value deals</h2>
      <button class="btn" id="new-deal">Add a deal</button>
    </div>

    <form class="editor hidden" id="deal-form">
      <h3 id="editor-title">Add a deal</h3>
      <div class="grid">
        <div><label for="d-year">Year</label><input id="d-year" type="number" min="1900" max="2100"></div>
        <div><label for="d-builder">Builder</label><input id="d-builder" required></div>
        <div class="span2"><label for="d-model">Model</label><input id="d-model"></div>
        <div><label for="d-length">Length (ft)</label><input id="d-length" type="number" step="0.1" min="0"></div>
        <div><label for="d-price">Asking price ($)</label><input id="d-price" type="number" step="1" min="0"></div>
        <div class="span2"><label for="d-location">Location</label><input id="d-location" placeholder="City, state"></div>
        <div class="span2"><label for="d-engines">Engines</label><input id="d-engines" placeholder="e.g. Twin CAT C18s, 1,100 hours"></div>
        <div class="span2"><label for="d-link">Listing link</label><input id="d-link" type="url" placeholder="https://www.yachtworld.com/..."></div>
        <div class="span4"><label for="d-verdict">Your one-line verdict</label><input id="d-verdict" placeholder="e.g. Priced below comparable boats, with low engine hours."></div>
        <div class="span4"><label for="d-take">Why I picked this boat</label><textarea id="d-take" placeholder="Why she stands out.&#10;&#10;What I'd check at survey and sea trial.&#10;&#10;Who she's right for."></textarea><p class="hint">Leave a blank line between paragraphs.</p></div>
        <div><label for="d-tag">Label</label><input id="d-tag" placeholder="New find, Price drop..." list="tag-options"></div>
        <div><label for="d-status">Status</label><select id="d-status"><option value="active">Active</option><option value="under_contract">Under contract</option><option value="sold">Sold</option></select></div>
        <div class="span2"><label class="check"><input type="checkbox" id="d-published"> Show on the website</label></div>
      </div>
      <datalist id="tag-options"><option value="New find"><option value="Price drop"><option value="Just reduced"><option value="Rare find"></datalist>
      <div class="actions">
        <button class="btn" type="submit">Save deal</button>
        <button class="btn light" type="button" id="cancel-deal">Cancel</button>
        <span class="msg" id="deal-msg"></span>
      </div>
    </form>

    <div id="deals"></div>
  </section>

</main>

<script>
  var SUPABASE_URL = "https://zpokavgizlkwukmonihj.supabase.co";
  var SUPABASE_KEY = "sb_publishable_MLFS-SAOVwE5asfMxpBL1Q_Ub7g5ly7";
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var TOPICS = { buy: "Buy a yacht", opinion: "Opinion on a boat", deal: "Question about a deal", export: "Buy from overseas", sell: "Sell my yacht", other: "Something else" };
  var FIELDS = [["email","Email"],["phone","Phone"],["contact_by","Best way to reach"],["budget","Budget"],["yacht_type","Type of yacht"],["length","Length"],["timeframe","Timeframe"],["destination","Export destination"],["listing_link","Listing link"],["deal","Deal"],["your_yacht","Their yacht"],["yacht_location","Yacht location"],["expected_price","Expected price"],["message","Message"]];

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function when(t) { return new Date(t).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
  function show(view) {
    ["login-view","leads-view","deals-view"].forEach(function (v) { $(v).classList.toggle("hidden", v !== view); });
    $("nav").classList.toggle("hidden", view === "login-view");
    $("tab-leads").setAttribute("aria-selected", view === "leads-view");
    $("tab-deals").setAttribute("aria-selected", view === "deals-view");
  }

  /* ---------- Sign in ---------- */
  $("login-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    $("login-msg").textContent = "Signing in...";
    var res = await sb.auth.signInWithPassword({ email: $("l-email").value.trim(), password: $("l-pass").value });
    if (res.error) { $("login-msg").textContent = "Sign-in failed. Check your email and password."; return; }
    $("l-pass").value = ""; $("login-msg").textContent = "";
    start();
  });
  $("logout").addEventListener("click", async function () { await sb.auth.signOut(); show("login-view"); });
  $("tab-leads").addEventListener("click", function () { show("leads-view"); loadLeads(); });
  $("tab-deals").addEventListener("click", function () { show("deals-view"); loadDeals(); });

  function start() { show("leads-view"); loadLeads(); }
  sb.auth.getSession().then(function (r) { if (r.data && r.data.session) start(); });

  /* ---------- Inquiries ---------- */
  var leadFilter = "open", LEADS = [];
  $("lead-filters").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    leadFilter = b.dataset.f;
    this.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
    renderLeads();
  });

  async function loadLeads() {
    $("leads").innerHTML = '<div class="empty">Loading...</div>';
    var res = await sb.from("inquiries").select("*").order("created_at", { ascending: false }).limit(500);
    if (res.error) { $("leads").innerHTML = '<div class="empty">Could not load inquiries. Sign out and back in.</div>'; return; }
    LEADS = res.data; renderLeads();
  }

  function renderLeads() {
    var n = LEADS.filter(function (l) { return l.status === "new"; }).length;
    $("new-count").textContent = n; $("new-count").classList.toggle("hidden", !n);
    var list = LEADS.filter(function (l) {
      return leadFilter === "all" || (leadFilter === "open" ? l.status !== "closed" : l.status === leadFilter);
    });
    if (!list.length) { $("leads").innerHTML = '<div class="empty">No inquiries here.</div>'; return; }
    $("leads").innerHTML = list.map(function (l) {
      var sub = l.your_yacht || l.deal || l.budget || l.listing_link || "";
      var rows = FIELDS.filter(function (f) { return l[f[0]]; }).map(function (f) {
        var v = esc(l[f[0]]);
        if (f[0] === "email") v = '<a href="mailto:' + v + '">' + v + '</a>';
        if (f[0] === "phone") v = '<a href="tel:' + esc(String(l.phone).replace(/[^0-9+]/g, "")) + '">' + v + '</a>';
        if (f[0] === "listing_link" && /^https?:\/\//i.test(l.listing_link)) v = '<a href="' + v + '" target="_blank" rel="noopener">' + v + '</a>';
        return '<dt>' + f[1] + '</dt><dd>' + v + '</dd>';
      }).join("");
      return '<article class="card ' + (l.status === "new" ? "new" : "") + '" data-id="' + l.id + '">' +
        '<div class="card-head" data-toggle>' +
          '<div><h3>' + esc(l.name) + ' <span class="muted" style="font-size:1rem">\u2014 ' + esc(TOPICS[l.topic] || l.topic) + '</span></h3>' +
          '<div class="meta">' + when(l.created_at) + (sub ? ' \u00b7 ' + esc(sub) : '') + '</div></div>' +
          '<div><span class="pill ' + l.status + '">' + l.status.charAt(0).toUpperCase() + l.status.slice(1) + '</span></div>' +
        '</div>' +
        '<div class="card-body hidden">' +
          '<dl class="details">' + rows + '</dl>' +
          '<div class="actions">' +
            '<a class="btn small" href="mailto:' + esc(l.email) + '?subject=' + encodeURIComponent("Sea Yachts: your inquiry") + '">Reply by email</a>' +
            (l.phone ? '<a class="btn small light" href="tel:' + esc(String(l.phone).replace(/[^0-9+]/g, "")) + '">Call</a>' : '') +
            '<select data-status aria-label="Status">' +
              ['new','contacted','closed'].map(function (s) { return '<option value="' + s + '"' + (s === l.status ? ' selected' : '') + '>Mark ' + s + '</option>'; }).join("") +
            '</select>' +
            '<button class="btn small danger" data-delete>Delete</button>' +
          '</div>' +
        '</div>' +
      '</article>';
    }).join("");
  }

  $("leads").addEventListener("click", async function (e) {
    var card = e.target.closest(".card"); if (!card) return;
    var id = card.dataset.id;
    if (e.target.closest("[data-toggle]")) { card.querySelector(".card-body").classList.toggle("hidden"); return; }
    if (e.target.closest("[data-delete]")) {
      if (!confirm("Delete this inquiry for good?")) return;
      var r = await sb.from("inquiries").delete().eq("id", id);
      if (r.error) return alert("Could not delete. Try again.");
      LEADS = LEADS.filter(function (l) { return l.id !== id; }); renderLeads();
    }
  });
  $("leads").addEventListener("change", async function (e) {
    if (!e.target.matches("[data-status]")) return;
    var id = e.target.closest(".card").dataset.id, status = e.target.value;
    var r = await sb.from("inquiries").update({ status: status }).eq("id", id);
    if (r.error) return alert("Could not update. Try again.");
    LEADS.forEach(function (l) { if (l.id === id) l.status = status; }); renderLeads();
  });

  /* ---------- Deals ---------- */
  var DEALS = [], editingId = null;
  var STATUS = { active: "Active", under_contract: "Under contract", sold: "Sold" };

  async function loadDeals() {
    $("deals").innerHTML = '<div class="empty">Loading...</div>';
    var res = await sb.from("deals").select("*").order("sort_order", { ascending: true }).order("created_at", { ascending: false });
    if (res.error) { $("deals").innerHTML = '<div class="empty">Could not load deals. Sign out and back in.</div>'; return; }
    DEALS = res.data; renderDeals();
  }

  function renderDeals() {
    if (!DEALS.length) { $("deals").innerHTML = '<div class="empty">No deals yet. Click "Add a deal" to post your first boat.</div>'; return; }
    $("deals").innerHTML = DEALS.map(function (d, i) {
      var title = [d.year, d.builder, d.model].filter(Boolean).join(" ");
      var meta = [d.length_ft ? Number(d.length_ft) + " ft" : "", d.location, d.price ? "$" + Number(d.price).toLocaleString("en-US") : ""].filter(Boolean).join(" \u00b7 ");
      return '<article class="card" data-id="' + d.id + '"><div class="deal-row">' +
        '<div class="order"><button data-up ' + (i === 0 ? "disabled" : "") + ' aria-label="Move up">\u25B2</button><button data-down ' + (i === DEALS.length - 1 ? "disabled" : "") + ' aria-label="Move down">\u25BC</button></div>' +
        '<div><h3>' + esc(title) + '</h3><div class="meta">' + esc(meta) + '</div>' +
          '<div class="badges"><span class="pill ' + (d.published ? "live" : "draft") + '">' + (d.published ? "On website" : "Hidden") + '</span>' +
          '<span class="pill">' + STATUS[d.status] + '</span>' + (d.tag ? '<span class="pill">' + esc(d.tag) + '</span>' : '') + '</div></div>' +
        '<div class="actions">' +
          '<button class="btn small light" data-publish>' + (d.published ? "Hide" : "Show on site") + '</button>' +
          '<button class="btn small" data-edit>Edit</button>' +
          '<button class="btn small danger" data-delete>Delete</button>' +
        '</div>' +
      '</div></article>';
    }).join("");
  }

  var F = { year: "d-year", builder: "d-builder", model: "d-model", length_ft: "d-length", price: "d-price", location: "d-location", engines: "d-engines", link: "d-link", verdict: "d-verdict", take: "d-take", tag: "d-tag", status: "d-status" };

  function openEditor(d) {
    editingId = d ? d.id : null;
    $("editor-title").textContent = d ? "Edit deal" : "Add a deal";
    Object.keys(F).forEach(function (k) { $(F[k]).value = d && d[k] != null ? d[k] : (k === "status" ? "active" : ""); });
    $("d-published").checked = d ? d.published : false;
    $("deal-msg").textContent = ""; $("deal-msg").className = "msg";
    $("deal-form").classList.remove("hidden");
    $("deal-form").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  $("new-deal").addEventListener("click", function () { openEditor(null); });
  $("cancel-deal").addEventListener("click", function () { $("deal-form").classList.add("hidden"); });

  $("deal-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var row = {};
    Object.keys(F).forEach(function (k) {
      var v = $(F[k]).value.trim();
      if (["year","length_ft","price"].indexOf(k) !== -1) row[k] = v === "" ? null : Number(v);
      else row[k] = v === "" ? null : v;
    });
    row.published = $("d-published").checked;
    if (!row.builder) { $("deal-msg").textContent = "Builder is required."; return; }
    $("deal-msg").textContent = "Saving...";
    var r;
    if (editingId) r = await sb.from("deals").update(row).eq("id", editingId);
    else {
      row.sort_order = DEALS.length ? Math.min.apply(null, DEALS.map(function (d) { return d.sort_order; })) - 1 : 0;
      r = await sb.from("deals").insert(row);
    }
    if (r.error) { $("deal-msg").textContent = "Could not save: " + r.error.message; return; }
    $("deal-form").classList.add("hidden");
    loadDeals();
  });

  $("deals").addEventListener("click", async function (e) {
    var card = e.target.closest(".card"); if (!card) return;
    var id = card.dataset.id, i = DEALS.findIndex(function (d) { return d.id === id; }), d = DEALS[i], r;
    if (e.target.closest("[data-edit]")) return openEditor(d);
    if (e.target.closest("[data-publish]")) {
      r = await sb.from("deals").update({ published: !d.published }).eq("id", id);
      if (r.error) return alert("Could not update. Try again.");
      return loadDeals();
    }
    if (e.target.closest("[data-delete]")) {
      if (!confirm("Delete this deal for good?")) return;
      r = await sb.from("deals").delete().eq("id", id);
      if (r.error) return alert("Could not delete. Try again.");
      return loadDeals();
    }
    var up = e.target.closest("[data-up]"), down = e.target.closest("[data-down]");
    if (up || down) {
      var j = up ? i - 1 : i + 1; if (j < 0 || j >= DEALS.length) return;
      /* renumber the whole list so positions are always clean */
      var order = DEALS.slice(); var t = order[i]; order[i] = order[j]; order[j] = t;
      await Promise.all(order.map(function (x, n) { return x.sort_order === n ? null : sb.from("deals").update({ sort_order: n }).eq("id", x.id); }));
      loadDeals();
    }
  });
</script>
